<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi catálogo de series</title>
<style>
:root{--bg:#fff6fa;--card:#fff;--ink:#352a31;--muted:#8d7b85;--pink:#e58aaa;--pink2:#f7d7e3;--line:#f0dbe3;--gold:#f2bd4b;--danger:#c85b70}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff3f8 0,#fffafc 45%,#fff 100%);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:34px 18px 20px;text-align:center}h1{margin:0;font-size:32px}header p{margin:8px 0;color:var(--muted)}
.wrap{max-width:1200px;margin:auto;padding:0 16px 40px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.tab{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:999px;cursor:pointer;color:var(--ink)}.tab.active{background:var(--pink2);border-color:#efbdd0;font-weight:700}
.toolbar{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;display:grid;grid-template-columns:1.7fr repeat(4,1fr);gap:10px;box-shadow:0 8px 30px #e8cbd622}
input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;color:var(--ink)}textarea{min-height:80px;resize:vertical}
button{border:0;border-radius:12px;padding:10px 14px;cursor:pointer}.primary{background:var(--pink);color:white;font-weight:700}.soft{background:var(--pink2);color:var(--ink)}.ghost{background:#fff;border:1px solid var(--line)}.danger{background:#f9e0e6;color:#9d3e54}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:18px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center}.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 7px 25px #e8cbd61c;position:relative}.rank{position:absolute;right:14px;top:12px;font-weight:800;color:#c68a25}.title{font-weight:800;font-size:18px;padding-right:35px}.stars{color:var(--gold);letter-spacing:1px;margin:7px 0}.meta{display:flex;gap:6px;flex-wrap:wrap}.pill{font-size:12px;background:#f8eef2;border-radius:999px;padding:5px 8px}.note{font-size:13px;color:var(--muted);margin:10px 0;line-height:1.35}.actions{display:flex;gap:7px;margin-top:12px}.actions button{flex:1;padding:8px}
.empty{padding:45px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:#2f202855;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal.open{display:flex}.modalbox{background:#fff;border-radius:22px;max-width:620px;width:100%;padding:20px;max-height:92vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.check{display:flex;align-items:center;gap:8px}.check input{width:auto}.footer{margin-top:22px;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:850px){.toolbar{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.toolbar{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.modalgrid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header>
  <h1>📺 Mi catálogo de series</h1>
  <p>Mi ranking personal · ⭐ puntuaciones · 💗 favoritas</p>
</header>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="toolbar">
    <input id="search" placeholder="🔎 Buscar serie, tipo, estado o nota...">
    <select id="score"><option value="">Todas las puntuaciones</option><option value="5">⭐⭐⭐⭐⭐</option><option value="4">⭐⭐⭐⭐</option><option value="3">⭐⭐⭐</option><option value="2">⭐⭐</option><option value="1">⭐</option><option value="none">Sin puntuar</option></select>
    <select id="status"><option value="">Todos los estados</option></select>
    <select id="type"><option value="">Todos los tipos</option></select>
    <select id="fav"><option value="">Favoritas: todas</option><option value="yes">❤️ Sí</option><option value="no">No</option></select>
    <select id="sort">
  <option value="rank">🏆 Ranking</option>
  <option value="title-asc">🔤 Título A → Z</option>
  <option value="title-desc">🔤 Título Z → A</option>
  <option value="score-desc">⭐ Mayor puntuación</option>
  <option value="score-asc">⭐ Menor puntuación</option>
  <option value="year-desc">📅 Año más reciente</option>
  <option value="year-asc">📅 Año más antiguo</option>
</select>
  </div>
  <div class="stats" id="stats"></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px">
    <button class="primary" onclick="openForm()">＋ Agregar serie</button>
    <button class="soft" onclick="syncFromGoogle()">🔄 Actualizar</button><button class="soft" onclick="exportData()">⬇️ Exportar datos</button>
    <label class="ghost" style="padding:10px 14px;border-radius:12px;cursor:pointer">⬆️ Importar datos<input type="file" accept=".json" style="display:none" onchange="importData(event)"></label>
  </div>
  <div class="grid" id="grid"></div>
  <div class="footer">Los datos actuales están incorporados en este archivo. La conexión con Google Sheets se puede activar después mediante Apps Script.</div>
</div>

<div class="modal" id="modal">
  <div class="modalbox">
    <div class="modalhead"><h2 id="modalTitle">Agregar serie</h2><button class="ghost" onclick="closeForm()">✕</button></div>
    <form id="form" onsubmit="saveSeries(event)">
      <input type="hidden" id="editId">
      <div class="modalgrid">
        <div class="full"><label>Título<input id="fTitle" required></label></div>
        <div><label>Puntuación<select id="fScore"><option value="">Sin puntuar</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label></div>
        <div><label>Estado<select id="fStatus"></select></label></div>
        <div><label>Tipo<select id="fType"></select></label></div>
        <div><label>Año<input id="fYear" type="text"></label></div>
        <div class="check"><input id="fFav" type="checkbox"><label for="fFav">❤️ Favorita</label></div>
        <div class="full"><label>Notas<textarea id="fNotes"></textarea></label></div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button type="button" class="ghost" onclick="closeForm()">Cancelar</button><button class="primary">Guardar</button></div>
    </form>
  </div>
</div>

  }catch(err){
    console.warn("No se pudo leer Google Sheets:", err);
    document.querySelector(".footer").textContent = "🟡 No se pudo sincronizar ahora; mostrando los datos guardados localmente.";
  }
}

function renderTabs(){
  const tabs=[["ranking","🏆 Ranking"],["all","📺 Todas"],["fav","❤️ Favoritas"],["Viendo","👀 Viendo"],["Pausada","⏸️ Pausadas"],["Para ver","📌 Para ver"],["Abandonada","🚫 Abandonadas"],["none","❓ Sin puntuar"]];
  document.getElementById("tabs").innerHTML=tabs.map(([id,label])=>`<button class="tab ${activeTab===id?"active":""}" onclick="activeTab='${id}';renderTabs();render()">${label}</button>`).join("");
}
function render(){
  const q=norm(document.getElementById("search").value), score=document.getElementById("score").value, status=document.getElementById("status").value, type=document.getElementById("type").value, fav=document.getElementById("fav").value;
  let arr=[...data];
  if(activeTab==="ranking") arr=arr.filter(x=>x.Puntuación!==""&&x.Puntuación!==null).sort((a,b)=>(Number(b.Puntuación)-Number(a.Puntuación))||(b.Favorita?1:0)-(a.Favorita?1:0)||Number(a.ID)-Number(b.ID));
  else if(activeTab==="fav") arr=arr.filter(x=>x.Favorita===true||String(x.Favorita).toLowerCase()==="true");
  else if(activeTab==="none") arr=arr.filter(x=>x.Puntuación===""||x.Puntuación===null);
  else if(activeTab!=="all") arr=arr.filter(x=>norm(x.Estado)===norm(activeTab));
  arr=arr.filter(x=>{
    const hay=norm([x.Título,x.Estado,x.Tipo,x.Notas,""+x["Nota original"]].join(" "));
    return (!q||hay.includes(q))&&(!score||(score==="none"?(x.Puntuación===""||x.Puntuación===null):String(x.Puntuación)===score))&&(!status||x.Estado===status)&&(!type||x.Tipo===type)&&(!fav||(fav==="yes"?x.Favorita===true||String(x.Favorita).toLowerCase()==="true":!(x.Favorita===true||String(x.Favorita).toLowerCase()==="true")));
  });
  document.getElementById("grid").innerHTML=arr.length?arr.map((x,i)=>card(x,activeTab==="ranking"?i+1:null)).join(""):`<div class="empty">No hay series que coincidan con los filtros.</div>`;
  stats();
}
function card(x,rank){
  return `<article class="card">${rank?`<div class="rank">#${rank}</div>`:""}<div class="title">${esc(x.Título)} ${x.Favorita===true||String(x.Favorita).toLowerCase()==="true"?"💗":""}</div><div class="stars">${stars(x.Puntuación)}</div><div class="meta"><span class="pill">${esc(x.Estado||"Sin especificar")}</span><span class="pill">${esc(x.Tipo||"Serie")}</span>${x.Año?`<span class="pill">${esc(x.Año)}</span>`:""}</div>${x.Notas?`<div class="note">${esc(x.Notas)}</div>`:""}<div class="actions"><button class="soft" onclick="editSeries(${x.ID})">✏️ Editar</button><button class="danger" onclick="deleteSeries(${x.ID})">🗑️</button></div></article>`;
}
function stats(){
  const total=data.length,p=data.filter(x=>x.Puntuación!==""&&x.Puntuación!==null),avg=p.length?(p.reduce((a,x)=>a+Number(x.Puntuación),0)/p.length).toFixed(1):"—";
  const fav=data.filter(x=>x.Favorita===true||String(x.Favorita).toLowerCase()==="true").length;
  const count=s=>data.filter(x=>x.Estado===s).length;
  document.getElementById("stats").innerHTML=[["Total",total],["Puntuadas",p.length],["Promedio",avg+" ⭐"],["❤️ Favoritas",fav],["Viendo",count("Viendo")],["Sin puntuar",total-p.length]].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join("");
}
function openForm(item=null){
  document.getElementById("modal").classList.add("open");
  document.getElementById("modalTitle").textContent=item?"Editar serie":"Agregar serie";
  document.getElementById("editId").value=item?.ID||"";
  document.getElementById("fTitle").value=item?.Título||"";
  document.getElementById("fScore").value=item?.Puntuación??"";
  document.getElementById("fStatus").innerHTML=statuses.map(v=>`<option ${v===(item?.Estado||"Terminada")?"selected":""}>${v}</option>`).join("");
  document.getElementById("fType").innerHTML=types.map(v=>`<option ${v===(item?.Tipo||"Serie")?"selected":""}>${v}</option>`).join("");
  document.getElementById("fYear").value=item?.Año||"";
  document.getElementById("fFav").checked=item?.Favorita===true||String(item?.Favorita).toLowerCase()==="true";
  document.getElementById("fNotes").value=item?.Notas||"";
}
function closeForm(){document.getElementById("modal").classList.remove("open");}
async function saveSeries(e){
  e.preventDefault();

  const id = document.getElementById("editId").value;

  const obj = {
    ID: id
      ? Number(id)
      : Math.max(0, ...data.map(x => Number(x.ID) || 0)) + 1,

    Título: document.getElementById("fTitle").value.trim(),

    Puntuación: document.getElementById("fScore").value === ""
      ? ""
      : Number(document.getElementById("fScore").value),

    Estado: document.getElementById("fStatus").value,

    Tipo: document.getElementById("fType").value,

    Favorita: document.getElementById("fFav").checked,

    Año: document.getElementById("fYear").value.trim(),

    Notas: document.getElementById("fNotes").value.trim(),

    "Nota original": document.getElementById("fNotes").value.trim()
  };

  try {

    const response = await fetch(
      "https://script.google.com/macros/s/AKfycbxPt0-GOJhuF6dXp1RcaxGe5zVOMs6sE2ouj1sg5x1xR0Z_T5HJc3DEO98RlZendVwa-g/exec",
      {
        method: "POST",
        body: JSON.stringify({
          action: id ? "update" : "add",
          data: obj
        })
      }
    );

    if (!response.ok) {
      throw new Error("No se pudo conectar con Google Sheets.");
    }

    if (id) {
      const i = data.findIndex(x => Number(x.ID) === Number(id));
      if (i >= 0) data[i] = obj;
    } else {
      data.push(obj);
    }

    saveLocal();
    closeForm();
    render();

    alert(id
      ? "Serie actualizada correctamente."
      : "Serie agregada correctamente."
    );

  } catch (error) {

    console.error(error);

    alert(
      "No se pudo guardar en Google Sheets. " +
      "Los cambios no fueron enviados."
    );
  }
}
function editSeries(id){const x=data.find(x=>Number(x.ID)===Number(id));if(x)openForm(x);}
async function deleteSeries(id){
  const x=data.find(x=>Number(x.ID)===Number(id));
  if(!x)return;

  if(!confirm(`¿Eliminar "${x.Título}"?`))return;

  try{
    const response=await fetch(
      "https://script.google.com/macros/s/AKfycbxPt0-GOJhuF6dXp1RcaxGe5zVOMs6sE2ouj1sg5x1xR0Z_T5HJc3DEO98RlZendVwa-g/exec",
      {
        method:"POST",
        body:JSON.stringify({
          action:"delete",
          data:{ID:x.ID}
        })
      }
    );

    if(!response.ok){
      throw new Error("No se pudo conectar con Google Sheets.");
    }

    data=data.filter(y=>Number(y.ID)!==Number(id));

    saveLocal();
    render();

    alert("Serie eliminada correctamente.");

  }catch(error){
    console.error(error);
    alert("No se pudo eliminar la serie de Google Sheets.");
  }
}
  function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="series_backup.json";a.click();URL.revokeObjectURL(a.href);}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const incoming=JSON.parse(r.result);if(!Array.isArray(incoming))throw Error();const map=new Map(data.map(x=>[norm(x.Título),x]));incoming.forEach(x=>{const k=norm(x.Título);if(k)map.set(k,x)});data=[...map.values()].map((x,i)=>({...x,ID:i+1}));saveLocal();render();alert("Datos importados correctamente.");}catch(err){alert("No se pudo importar el archivo JSON.");}};r.readAsText(f);}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
setup();
